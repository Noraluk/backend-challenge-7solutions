services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      mongodb:
        condition: service_healthy
        restart: true
    init: true
    restart: unless-stopped
    networks:
      - backend

  mongodb:
    image: mongo:8.2
    attach: false
    command: ["mongod", "--quiet"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    restart: unless-stopped
    networks:
      - backend

volumes:
  mongodb_data:
  go_modules:
  go_build_cache:

networks:
  backend:
